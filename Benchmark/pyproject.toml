[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "povi-bench"
version = "0.6.0"
description = "PoVi-Bench: poetry teaching video evaluation (S/D/R metrics)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.68,<3",
  "jsonschema>=4.23,<5",
  "av>=13,<17",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "Pillow>=10,<13",
  "opencv-python-headless>=4.10,<6",
  "python-dotenv>=1,<2",
]

[project.scripts]
povi-bench = "bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bench*"]

[tool.setuptools.package-data]
"bench.resources" = [
  "metrics/*.json",
  "prompts/*.md",
  "rubrics/*.json",
  "schemas/*.json",
]
